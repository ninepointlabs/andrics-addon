name: Test

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Generated data is up to date
        run: python3 tools/build_data.py --check
      - name: Lua syntax
        run: for f in $(git ls-files '*.lua'); do lua5.1 -e "assert(loadfile('$f'))"; done
      - name: Addon headless tests
        run: lua5.1 tests/run.lua
      - name: Poller tests
        run: python3 tools/priest-changes-poller/tests/test_poller.py -v
